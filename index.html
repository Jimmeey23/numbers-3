<!doctype html>
<html lang="en" data-theme="matte" data-mode="dark" data-density="compact">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas — Physique 57 India performance</title>
    <meta name="description" content="Atlas — studio performance for Physique 57 India." />
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='2' y='2' width='36' height='36' rx='11' fill='%23131920'/%3E%3Cpath d='M11 29 20 10 29 29M15 23h10' fill='none' stroke='%234FC3F7' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&family=Instrument+Sans:wght@400;500;600&display=swap" />
    <script>
      /* Applied before first paint, so the page never flashes the default theme. The dark list is
         repeated here on purpose: it is three names, and importing the registry would mean waiting
         for the bundle. Keep it in step with src/design/ramps.ts. */
      (function(){try{
        var DARK={matte:1,carbon:1,aurora:1};
        var ALL={matte:1,gloss:1,carbon:1,aurora:1,paper:1,contrast:1};
        var t=(localStorage.getItem('floor.theme')||'').replace(/"/g,'');
        if(!ALL[t])t='matte';
        var r=document.documentElement;
        r.setAttribute('data-theme',t);
        r.setAttribute('data-mode',DARK[t]?'dark':'light');
        var d=localStorage.getItem('floor.density');if(d)r.setAttribute('data-density',d.replace(/"/g,''));
      }catch(e){}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
